# Agent settings. Copy to agent.toml next to the agent's executable, or pass --config <path>.
# Without a file, the agent accepts direct connections on port 8080 with the defaults below.

# Clients connect straight to this agent. Leave out to turn off.
[direct]
port = 8080 # --port overrides this, and turns direct connections on
# loopback_only = true # Only accept signaling at 127.0.0.1
# bind_address = "192.168.1.20" # Bind signaling to one IPv4 address unless loopback_only is set

# The agent connects out to an orchprox. Leave out to turn off.
# Not implemented yet: the agent only checks the url.
# [orchprox]
# url = "wss://orchprox.example.com"

# Linux only. Use a named BGRx PipeWire video source such as gamescope.
# Use the native dimensions.
# [capture]
# pipewire_node = "gamescope"
# width_px = 1280
# height_px = 720
# Set the EIS socket to enable gamescope keyboard and mouse input. A filename
# is resolved under XDG_RUNTIME_DIR. An absolute path is also accepted.
# eis_socket = "gamescope-0-ei"
# With EIS and a patched gamescope, send viewer cursor requests to this socket.
# A filename is resolved under XDG_RUNTIME_DIR. An absolute path also works.
# pipewire_cursor_socket = "containerz-cursor.sock"
# Set the PipeWire sink node name to stream its monitor audio.
# pipewire_audio_sink = "containerz-game-audio"

# Leave out any setting to use its default.
[stream]
max_res_w_px = 1920        # Bounding box for the stream; default: the display's resolution
max_res_h_px = 1080
default_fps = 60           # Default 30
max_fps = 120              # 1–120, default 120
default_bitrate_kbps = 6000 # Default 8000
max_bitrate_kbps = 25000   # 500–50000, default 50000
