<!doctype html>
<meta charset="utf-8">
<title>GstSpike</title>
<button id="connect">Connect</button>
<span id="status">idle</span>
<br>
<video id="video" autoplay muted playsinline style="max-width: 100%; background: #000"></video>
<script>
  const connectButton = document.getElementById("connect");
  const statusText = document.getElementById("status");
  const video = document.getElementById("video");

  connectButton.onclick = async () => {
    const pc = new RTCPeerConnection();
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.ontrack = (event) => (video.srcObject = event.streams[0] ?? new MediaStream([event.track]));
    pc.onconnectionstatechange = () => (statusText.textContent = pc.connectionState);

    await pc.setLocalDescription(await pc.createOffer());

    // Non-trickle ICE: send the offer only once all candidates are gathered.
    await new Promise((resolve) => {
      if (pc.iceGatheringState === "complete") return resolve();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && resolve();
    });

    const response = await fetch("http://localhost:8080/offer", {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp,
    });
    if (!response.ok) {
      statusText.textContent = `signaling failed: ${response.status} ${await response.text()}`;
      return;
    }
    await pc.setRemoteDescription({ type: "answer", sdp: await response.text() });
  };
</script>
